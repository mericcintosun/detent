[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Hedera's EVM is Shanghai equivalent. Foundry would otherwise default 0.8.24 to
# cancun, and the day a memory copy or a transient variable makes solc emit MCOPY
# or TSTORE the deployment would fail on the relay rather than at compile time.
# Today's bytecode uses nothing past PUSH0; this keeps it that way.
evm_version = "shanghai"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
